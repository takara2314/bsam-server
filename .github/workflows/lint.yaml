name: Go CI

on: [pull_request]

jobs:
  validate-go-code:
    name: Validate Go Code
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go Version Consistency
        run: |
          required_version=$(go mod edit -json | jq -r '.Go')
          docker_version=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine AS builder$/\1/p' cmd/server-v4/Dockerfile)
          test "$required_version" = "$docker_version"

      - name: Run Tests
        run: go test ./...

      - name: Build Server
        run: go build -o /tmp/server-v4 -trimpath ./cmd/server-v4/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
